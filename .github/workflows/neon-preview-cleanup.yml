# Delete Neon preview database branches created by the Neon ↔ Vercel
# integration.
#
# Triggers:
#   pull_request closed  — delete preview/<git-head-ref> for that PR
#   workflow_dispatch    — dry-run or apply bulk prune of ALL non-protected
#                          Neon branches (keeps default/primary/protected +
#                          main, production, vercel-dev)
#
# Setup (once):
#   Repo variable  NEON_PROJECT_ID  — Neon Console → Project Settings
#   Repo secret    NEON_API_KEY     — Neon Console → Account Settings → API Keys
#
# Local equivalent:
#   NEON_PROJECT_ID=… NEON_API_KEY=… ./scripts/neon-prune.sh
#   NEON_PROJECT_ID=… NEON_API_KEY=… ./scripts/neon-prune.sh --apply --yes
#
# See: https://neon.com/docs/guides/vercel-branch-cleanup

name: Cleanup Neon preview branch

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete non-protected Neon branches (unchecked = dry-run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  delete-neon-branch:
    name: Delete Neon preview branch (PR close)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Check Neon credentials
        id: check
        run: |
          if [ -z "${NEON_PROJECT_ID}" ] || [ -z "${NEON_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NEON_PROJECT_ID / NEON_API_KEY not set — skipping Neon preview cleanup."
            echo "Set the repo variable NEON_PROJECT_ID and secret NEON_API_KEY (see docs/deploy-frontline-gay.md §2c)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Will delete Neon branch: preview/${{ github.head_ref }}"
          fi

      - name: Delete preview/${{ github.head_ref }}
        if: steps.check.outputs.configured == 'true'
        uses: neondatabase/delete-branch-action@v3
        # Safe if the branch was already deleted by Neon/Vercel cleanup.
        continue-on-error: true
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ env.NEON_API_KEY }}

  prune-all-non-protected:
    name: Prune all non-protected Neon branches
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Check Neon credentials
        id: check
        run: |
          if [ -z "${NEON_PROJECT_ID}" ] || [ -z "${NEON_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NEON_PROJECT_ID / NEON_API_KEY not set — cannot prune."
            echo "Set the repo variable NEON_PROJECT_ID and secret NEON_API_KEY (see docs/deploy-frontline-gay.md §2c)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - name: Dry-run neon-prune
        if: steps.check.outputs.configured == 'true' && inputs.apply == false
        run: ./scripts/neon-prune.sh

      - name: Apply neon-prune
        if: steps.check.outputs.configured == 'true' && inputs.apply == true
        run: ./scripts/neon-prune.sh --apply --yes

      - name: Fail if credentials missing
        if: steps.check.outputs.configured != 'true'
        run: |
          echo "Refusing workflow_dispatch without NEON_PROJECT_ID / NEON_API_KEY."
          exit 1
